<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HDHA App</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:"Quicksand",sans-serif;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#ffd6e7,#fff0f6);
overflow:hidden;
}

/* background hearts */

.hearts span{
position:absolute;
color:#ff7fb0;
font-size:20px;
animation:float 7s linear infinite;
}

@keyframes float{
0%{transform:translateY(110vh)}
100%{transform:translateY(-10vh)}
}

/* login card */

.card{
width:360px;
background:white;
border-radius:30px;
padding:35px;
box-shadow:0 20px 50px rgba(255,105,160,0.25);
text-align:center;
position:relative;
z-index:2;
}

/* kitty */

.kitty{
width:120px;
margin:auto;
position:relative;
transition:0.3s;
}

.kitty img{
width:100%;
}

.paw{
position:absolute;
width:35px;
top:40px;
transition:0.3s;
}

.paw.left{
left:10px;
}

.paw.right{
right:10px;
}

.hide-eyes .paw{
top:5px;
}

/* text */

h1{
font-family:"Baloo 2";
color:#ff5fa3;
margin-bottom:5px;
}

.sub{
color:#9b5d77;
font-weight:600;
margin-bottom:20px;
}

/* input */

input{
width:100%;
padding:13px;
border-radius:14px;
border:1px solid #ffc1da;
font-size:15px;
}

input:focus{
outline:none;
border-color:#ff6fa9;
box-shadow:0 0 0 3px rgba(255,120,170,0.2);
}

/* button */

button{
margin-top:18px;
width:100%;
padding:13px;
border:none;
border-radius:30px;
background:linear-gradient(135deg,#ff7eb3,#ff4f8b);
color:white;
font-weight:700;
font-size:16px;
cursor:pointer;
transition:0.2s;
}

button:hover{
transform:scale(1.03);
box-shadow:0 10px 30px rgba(255,90,150,0.4);
}

/* status */

.status{
margin-top:10px;
font-weight:700;
color:#c04a7d;
}

/* sad animation */

.sad{
animation:shake .4s;
}

@keyframes shake{
0%{transform:translateX(0)}
25%{transform:translateX(-5px)}
50%{transform:translateX(5px)}
75%{transform:translateX(-5px)}
100%{transform:translateX(0)}
}

/* success hearts */

.big-heart{
position:fixed;
font-size:40px;
animation:love 2s ease forwards;
}

@keyframes love{
0%{transform:scale(0);opacity:1}
100%{transform:scale(3);opacity:0}
}

</style>
</head>

<body>

<div class="hearts">
<span style="left:10%">❤</span>
<span style="left:30%;animation-delay:2s">❤</span>
<span style="left:50%;animation-delay:4s">❤</span>
<span style="left:70%;animation-delay:1s">❤</span>
<span style="left:90%;animation-delay:3s">❤</span>
</div>

<div class="card">

<div class="kitty" id="kitty">

<img src="https://upload.wikimedia.org/wikipedia/en/0/05/Hello_Kitty_character_portrait.png">

<img class="paw left" src="https://cdn-icons-png.flaticon.com/512/616/616408.png">
<img class="paw right" src="https://cdn-icons-png.flaticon.com/512/616/616408.png">

</div>

<h1>HDHA App</h1>

<div class="sub">
Nhập mật khẩu để vào 
</div>

<form id="loginForm">

<input
id="password"
type="password"
placeholder="Nhập mật khẩu..."
required
>

<button type="submit">
Vào không gian của tụi mình
</button>

<div class="status" id="status"></div>

</form>

</div>

<script>

const passwordInput = document.getElementById("password")
const kitty = document.getElementById("kitty")
const form = document.getElementById("loginForm")
const status = document.getElementById("status")

const PASSWORD = "iloveyou"

passwordInput.addEventListener("focus",()=>{
kitty.classList.add("hide-eyes")
})

passwordInput.addEventListener("blur",()=>{
kitty.classList.remove("hide-eyes")
})

form.addEventListener("submit",(e)=>{

e.preventDefault()

if(passwordInput.value === PASSWORD){

status.innerText="Đúng rồi bé yêu 💖"

for(let i=0;i<10;i++){

let heart=document.createElement("div")
heart.innerHTML="💖"
heart.className="big-heart"

heart.style.left=Math.random()*100+"vw"
heart.style.top=Math.random()*100+"vh"

document.body.appendChild(heart)

setTimeout(()=>heart.remove(),2000)

}

setTimeout(()=>{
window.location.href="home.html"
},1500)

}else{

status.innerText="Sai mật khẩu rồi 🥺"

kitty.classList.add("sad")

setTimeout(()=>{
kitty.classList.remove("sad")
},400)

}

})

</script>

</body>
</html>
