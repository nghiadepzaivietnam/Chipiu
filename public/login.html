<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#f6b6c7;
font-family:sans-serif;
}
.phone{
width:360px;
height:680px;
background:white;
border-radius:40px;
box-shadow:0 30px 60px rgba(0,0,0,.25);
text-align:center;
padding-top:80px;
}
.kitty{
width:200px;
margin:auto;
position:relative;
}
.kitty img{
width:100%;
}
.eye{
width:10px;
height:10px;
background:black;
border-radius:50%;
position:absolute;
top:92px;
}
.eye.left{left:72px}
.eye.right{right:72px}
input{
width:240px;
padding:14px;
margin-top:20px;
border-radius:14px;
border:1px solid #ccc;
}
button{
margin-top:30px;
padding:16px 60px;
border:none;
border-radius:16px;
background:#ffb6c1;
font-weight:700;
}
.status{
margin-top:12px;
font-weight:700;
color:#a13b6a;
min-height:20px;
}
</style>
</head>
<body>
<div class="phone">
  <div class="kitty">
    <img src="/login.jpg" alt="Hello Kitty">
    <div class="eye left" id="eyeL"></div>
    <div class="eye right" id="eyeR"></div>
  </div>
  <form id="loginForm" autocomplete="off">
    <input id="user" placeholder="Username" value="chipiu">
    <input id="pass" type="password" placeholder="Password">
    <button type="submit">Login</button>
    <div class="status" id="loginStatus"></div>
  </form>
</div>
<script>
const eyeL=document.getElementById("eyeL")
const eyeR=document.getElementById("eyeR")

document.addEventListener("mousemove",e=>{
  let x=(e.clientX/window.innerWidth-.5)*10
  let y=(e.clientY/window.innerHeight-.5)*6
  eyeL.style.transform=`translate(${x}px,${y}px)`
  eyeR.style.transform=`translate(${x}px,${y}px)`
})
</script>
<script src="/login.js"></script>
</body>
</html>
