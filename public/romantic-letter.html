<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinematic Romantic Letter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/romantic-letter.css" />
  </head>
  <body>
    <div class="sky-gradient" aria-hidden="true"></div>
    <canvas id="starsCanvas" class="layer stars" aria-hidden="true"></canvas>
    <canvas id="heartsCanvas" class="layer hearts" aria-hidden="true"></canvas>
    <div class="mist mist-a" aria-hidden="true"></div>
    <div class="mist mist-b" aria-hidden="true"></div>
    <div class="atmosphere" aria-hidden="true"></div>

        ?

          <div class="rim-light"></div>
          <div class="envelope-reflect"></div>

            <div class="env-front"></div>
            <div class="env-flap"></div>

                <p class="line">Ngay lúc này dây, anh dang r?t xúc d?ng khi vi?t b?c thu này cho em. Tính d?n nay, chúng mình dã di cùng nhau du?c g?n m?t nam r?i d?y yêu nh?? M?i ngày trôi qua, l?i là m?t ngày dáng nh? vì có em ? c?nh bên.</p>

                <p class="line">Th?t may m?n khi m?i ngày anh th?c d?y, anh m? m?t ra l?i du?c th?y em ng? say, dù có cách xa nhau c? ngàn cây s?... Tuy xa m?t nhung không h? cách lòng, anh c?m nh?n du?c tình c?m c?a chúng mình dang l?n d?n lên. Nh?ng tin nh?n yêu thuong d?n tr? nên quen thu?c, nh?ng kho?ng cách vô hình gi?a hai chúng ta d?n tr? nên bi?n m?t. Ði?u dó, làm anh nh? d?n câu nói c?a em: "Tình yêu c?a em l?n lên t?ng ngày, Nghia ?!". Anh hi?u r?ng, ch?ng c?n ph?i ch?ng minh, vì s? d?ng hành c?a chúng ta là minh ch?ng rõ ràng nh?t gi?a tình yêu b?n d?p này.</p>
                <p class="line">Khi g?p em trong m?t anh, em là m?t cô bé m?nh m?. M?nh m? d?n khó tin, em r?t gi?i, em gi?i toàn di?n và tu duy c?a em là m?t "kì quan" vi d?i. V?y nên anh mong r?ng, ? bên d?y, dù thi?u th?n tình yêu thuong gia dình, b?n bè hay là tình yêu thuong c?a anh, dù có g?p khó khan thì em v?n luôn v?ng lòng d? bu?c t?i phía tru?c. C? m?t tuong lai sáng dang ch? dón em và anh s?n sàng d?ng hành cùng mình trên su?t ch?ng du?ng ?y.</p>
                <p class="line">Anh v?n luôn nói "Yêu em là di?u anh không th? ng?". Hai chúng ta tuy c? hai d?u còn nhi?u thi?u xót, có nh?ng l?n chúng ta cãi v?, tu?ng ch?ng nhu ch?ng th? hi?u du?c nhau... nhung th?t may m?n, sau m?i l?n nhu v?y, chúng ta l?i nhìn l?i, l?i yêu thuong và hòa h?p v?i nhau. Anh mong r?ng sau m?i l?n nhu v?y, chúng ta l?i có th? ng?i l?i, d? hi?u nhau và vi?t ti?p lên câu chuy?n c?a mình.</p>
                <p class="line">Ð?c bi?t r?ng, khi c? hai có v?n d?, anh không mu?n em IM L?NG. Vì anh thà th?y em ngang ngu?c, em khó ch?u và hung d? v?i anh còn hon là d? em ph?i ch?u b?t c? nh?ng u?t ?c nào m?t mình. V?y nên b?t c? khi nào em khó ch?u, mong em hi?u r?ng dù em có m?ng ch?i anh th? nào, anh cung s? không bao gi? hi?u l?m em.</p>

                <p class="line">Anh yêu c?a em,</p>

              </div>

          </div>
        </div>
      </button>

      <p class="hint">Click the envelope</p>
    </main>

    <audio id="bgAmbient" src="/audio/romantic-ambient.mp3" preload="none" loop></audio>
    <audio id="loveSong" src="/audio/noi-nay-co-anh.mp3" preload="none"></audio>

    <script src="/romantic-letter.js"></script>
    <script src="/auth-guard.js"></script>
</body>
</html>
