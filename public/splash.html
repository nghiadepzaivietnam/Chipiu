<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HDHA</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background:
          radial-gradient(circle at 18% 18%, rgba(255, 206, 222, 0.38), transparent 45%),
          radial-gradient(circle at 82% 12%, rgba(255, 220, 235, 0.45), transparent 45%),
          radial-gradient(circle at 50% 88%, rgba(255, 195, 219, 0.35), transparent 50%),
          #fff6f2;
        font-family: "Baloo 2", "Quicksand", "Segoe UI", sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      .splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: transparent;
      }
      .mark {
        font-size: clamp(40px, 14vw, 104px);
        font-weight: 700;
        letter-spacing: 0.18em;
        margin-left: 0.18em;
        color: #ff6fb0;
        text-shadow: 0 10px 22px rgba(255, 120, 170, 0.22);
        opacity: 0;
        transform: translateY(6px);
        animation: fadeIn 0.6s ease-out 0.2s forwards;
      }
      .mark::after {
        content: "♡";
        font-size: 0.5em;
        margin-left: 8px;
        color: #ff8bbf;
        vertical-align: top;
      }
      .hearts {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .heart {
        position: absolute;
        bottom: -10%;
        width: 14px;
        height: 14px;
        background: linear-gradient(140deg, #ff94c6, #ffc6dd);
        transform: rotate(45deg);
        border-radius: 4px 4px 0 0;
        opacity: 0;
        filter: drop-shadow(0 6px 10px rgba(255, 140, 188, 0.25));
        animation: floatUp 5s linear infinite;
      }
      .heart::before,
      .heart::after {
        content: "";
        position: absolute;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: inherit;
      }
      .heart::before { left: -7px; top: 0; }
      .heart::after { top: -7px; left: 0; }

      .fade-out {
        animation: fadeOut 0.45s ease-in forwards;
      }

      @keyframes fadeIn {
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeOut {
        to { opacity: 0; }
      }
      @keyframes floatUp {
        0% { transform: translateY(0) rotate(45deg) scale(0.85); opacity: 0; }
        10% { opacity: 0.9; }
        100% { transform: translateY(-120vh) rotate(45deg) scale(1.1); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .heart {
          animation: none;
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash" id="splash">
      <div class="hearts" aria-hidden="true">
        <span class="heart" style="left: 14%; animation-delay: 0.2s;"></span>
        <span class="heart" style="left: 28%; animation-delay: 1s; animation-duration: 5.6s;"></span>
        <span class="heart" style="left: 44%; animation-delay: 0.6s; animation-duration: 5.2s;"></span>
        <span class="heart" style="left: 62%; animation-delay: 1.4s; animation-duration: 5.8s;"></span>
        <span class="heart" style="left: 76%; animation-delay: 0.4s; animation-duration: 5.4s;"></span>
      </div>
      <div class="mark">HA</div>
    </div>

    <script>
      (function initSplash() {
        const splash = document.getElementById("splash");
        const params = new URLSearchParams(window.location.search);
        const rawNext = params.get("next") || "/index.html";
        const next = rawNext.startsWith("/") ? rawNext : "/index.html";
        const authed = localStorage.getItem("app_auth") === "1";
        const loginUrl = `/login.html?next=${encodeURIComponent(next)}`;
        const targetUrl = authed ? next : loginUrl;
        sessionStorage.setItem("splash_seen", "1");

        const totalMs = 2200;
        const fadeMs = 450;

        setTimeout(() => {
          splash.classList.add("fade-out");
        }, totalMs - fadeMs);

        setTimeout(() => {
          window.location.replace(targetUrl);
        }, totalMs);
      })();
    </script>
  </body>
</html>
