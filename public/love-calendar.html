<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nhật Ký Đôi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #fff4f8;
        --card: rgba(255, 255, 255, 0.8);
        --stroke: rgba(255, 196, 216, 0.6);
        --ink: #3a2430;
        --muted: #7b5566;
        --pink: #ff8fb6;
        --pink-2: #ffd2e3;
        --blue-2: #dbe7ff;
        --shadow: 0 18px 40px rgba(255, 120, 160, 0.2);
        --radius: 22px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Manrope", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 18% 18%, rgba(255, 210, 226, 0.6), transparent 45%),
          radial-gradient(circle at 82% 10%, rgba(255, 182, 215, 0.52), transparent 45%),
          radial-gradient(circle at 50% 92%, rgba(255, 210, 225, 0.5), transparent 55%),
          var(--bg);
      }

      .app {
        max-width: 980px;
        margin: 0 auto;
        padding: 28px 16px 96px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      header h1 {
        font-family: "Cormorant Garamond", serif;
        font-size: clamp(28px, 4vw, 40px);
        margin: 0;
      }

      .month-title {
        font-weight: 700;
        font-size: 15px;
        margin-top: 4px;
        color: var(--muted);
      }

      .month-nav {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: var(--card);
        border: 1px solid var(--stroke);
        border-radius: 999px;
        padding: 6px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(12px);
      }

      .month-nav button {
        border: none;
        background: #fff;
        color: var(--ink);
        font-weight: 700;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 6px 12px rgba(255, 140, 180, 0.15);
      }

      .calendar-card {
        background: var(--card);
        border: 1px solid var(--stroke);
        border-radius: var(--radius);
        padding: 16px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(12px);
      }

      .weekday {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 6px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .weekday span {
        text-align: center;
      }

      .days {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 6px;
      }

      .day {
        position: relative;
        border: none;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 16px;
        padding: 10px 0;
        text-align: center;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        color: var(--ink);
        min-height: 42px;
      }

      .day.outside {
        opacity: 0.45;
      }

      .day.today {
        box-shadow: 0 0 0 2px rgba(255, 150, 190, 0.6), 0 12px 26px rgba(255, 140, 180, 0.2);
      }

      .day.selected {
        transform: scale(1.04);
        box-shadow: 0 10px 22px rgba(255, 140, 180, 0.2);
      }

      .day.has-messages::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 6px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--pink);
        transform: translateX(-50%);
      }

      .day.many-messages::after {
        width: 8px;
        height: 8px;
        background: linear-gradient(140deg, var(--pink), var(--pink-2));
        box-shadow: 0 0 0 3px rgba(255, 170, 200, 0.25);
      }

      .sheet {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        background: rgba(30, 20, 26, 0.25);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
        padding: 0 10px env(safe-area-inset-bottom);
        z-index: 50;
      }

      .sheet.open {
        opacity: 1;
        pointer-events: auto;
      }

      .sheet-panel {
        width: min(860px, 100%);
        max-height: 85vh;
        background: rgba(255, 255, 255, 0.96);
        border-radius: 28px 28px 0 0;
        border: 1px solid var(--stroke);
        box-shadow: 0 -18px 40px rgba(255, 140, 180, 0.2);
        transform: translateY(100%);
        transition: transform 0.3s ease;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        backdrop-filter: blur(18px);
      }

      .sheet.open .sheet-panel {
        transform: translateY(0);
      }

      .sheet-handle {
        width: 48px;
        height: 5px;
        border-radius: 999px;
        background: rgba(60, 40, 50, 0.2);
        margin: 12px auto 6px;
      }

      .sheet-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 18px 8px;
      }

      .sheet-date {
        font-weight: 700;
        font-size: 16px;
      }

      .sheet-close {
        border: none;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 50%;
        width: 32px;
        height: 32px;
        cursor: pointer;
        font-weight: 700;
      }

      .messages {
        padding: 10px 18px 0;
        flex: 1;
        overflow-y: auto;
      }

      .bubble {
        max-width: 78%;
        padding: 12px 14px;
        border-radius: 20px;
        margin-bottom: 10px;
        font-size: 15px;
        line-height: 1.6;
        position: relative;
        animation: bubbleIn 0.2s ease;
      }

      .bubble.left {
        margin-right: auto;
        background: linear-gradient(150deg, var(--pink-2), #fff);
      }

      .bubble.right {
        margin-left: auto;
        background: linear-gradient(150deg, var(--blue-2), #fff);
      }

      .bubble .meta {
        display: block;
        margin-top: 6px;
        font-size: 11px;
        color: var(--muted);
      }

      @keyframes bubbleIn {
        from {
          transform: translateY(6px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .input-area {
        border-top: 1px solid var(--stroke);
        padding: 10px 16px 16px;
        background: rgba(255, 255, 255, 0.9);
      }

      .author-toggle {
        display: inline-flex;
        gap: 8px;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid var(--stroke);
        border-radius: 999px;
        padding: 4px;
        margin-bottom: 8px;
      }

      .author-toggle button {
        border: none;
        background: transparent;
        padding: 6px 12px;
        border-radius: 999px;
        font-weight: 600;
        cursor: pointer;
        color: var(--muted);
        font-size: 12px;
      }

      .author-toggle button.active {
        background: #fff;
        color: var(--ink);
        box-shadow: 0 6px 16px rgba(255, 150, 190, 0.2);
      }

      textarea {
        width: 100%;
        resize: none;
        border: 1px solid var(--stroke);
        border-radius: 14px;
        padding: 10px 12px;
        font-family: inherit;
        font-size: 14px;
        outline: none;
        min-height: 44px;
        max-height: 140px;
      }

      .input-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 8px;
        gap: 10px;
      }

      .edit-last {
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
      }

      .send-btn {
        border: none;
        background: linear-gradient(140deg, #ff7fa8, #ff9fc5);
        color: #fff;
        padding: 10px 16px;
        border-radius: 12px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 10px 20px rgba(255, 120, 160, 0.25);
      }

      @media (min-width: 860px) {
        .bubble {
          font-size: 16px;
        }

        textarea {
          font-size: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div>
          <h1>Nhật Ký Đôi</h1>
          <div class="month-title" id="monthTitle"></div>
        </div>
        <div class="month-nav">
          <button type="button" id="prevMonth" aria-label="Previous month">&lt;</button>
          <button type="button" id="nextMonth" aria-label="Next month">&gt;</button>
        </div>
      </header>

      <section class="calendar-card" aria-label="Love calendar">
        <div class="weekday">
          <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
        </div>
        <div class="days" id="calendarDays"></div>
      </section>
    </div>

    <div class="sheet" id="daySheet" aria-hidden="true">
      <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Day conversation">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <div class="sheet-date" id="sheetDate"></div>
          <button class="sheet-close" id="closeSheet" type="button" aria-label="Close">x</button>
        </div>
        <div class="messages" id="messageList"></div>
        <div class="input-area">
          <div class="author-toggle" role="tablist" aria-label="Chọn người viết">
            <button type="button" id="authorNghia" class="active">Trọng Nghĩa (Chồng iu)</button>
            <button type="button" id="authorChip">Chíp (Vợ iu)</button>
          </div>
          <textarea id="messageInput" placeholder="Viết điều bạn muốn nói..." rows="1"></textarea>
          <div class="input-actions">
            <button type="button" class="edit-last" id="editLastBtn">Sửa tin nhắn gần nhất</button>
            <button type="button" class="send-btn" id="sendBtn">Gửi</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const STORAGE_KEY = "love_calendar_chat";
        const calendarDays = document.getElementById("calendarDays");
        const monthTitle = document.getElementById("monthTitle");
        const prevMonthBtn = document.getElementById("prevMonth");
        const nextMonthBtn = document.getElementById("nextMonth");
        const sheet = document.getElementById("daySheet");
        const sheetDate = document.getElementById("sheetDate");
        const closeSheet = document.getElementById("closeSheet");
        const messageList = document.getElementById("messageList");
        const messageInput = document.getElementById("messageInput");
        const authorNghia = document.getElementById("authorNghia");
        const authorChip = document.getElementById("authorChip");
        const sendBtn = document.getElementById("sendBtn");
        const editLastBtn = document.getElementById("editLastBtn");

        const today = new Date();
        let monthCursor = new Date(today.getFullYear(), today.getMonth(), 1);
        let selectedIso = toIsoDate(today);
        let author = "nghia";
        let editingIndex = null;

        const state = loadState();

        function loadState() {
          try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
          } catch {
            return {};
          }
        }

        function saveState() {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function toIsoDate(date) {
          const y = date.getFullYear();
          const m = String(date.getMonth() + 1).padStart(2, "0");
          const d = String(date.getDate()).padStart(2, "0");
          return `${y}-${m}-${d}`;
        }

        function fromIso(iso) {
          const parts = iso.split("-");
          return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
        }

        function startOfMonth(date) {
          return new Date(date.getFullYear(), date.getMonth(), 1);
        }

        function addMonths(date, diff) {
          return new Date(date.getFullYear(), date.getMonth() + diff, 1);
        }

        function formatMonthTitle(date) {
          return date.toLocaleDateString("vi-VN", { month: "long", year: "numeric" });
        }

        function formatSheetDate(iso) {
          return fromIso(iso).toLocaleDateString("vi-VN", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
        }

        function getMessages(iso) {
          return Array.isArray(state[iso]) ? state[iso] : [];
        }

        function renderCalendar() {
          monthTitle.textContent = formatMonthTitle(monthCursor);
          calendarDays.innerHTML = "";
          const monthStart = startOfMonth(monthCursor);
          const firstWeekday = (monthStart.getDay() + 6) % 7;
          const gridStart = new Date(monthStart);
          gridStart.setDate(monthStart.getDate() - firstWeekday);

          for (let i = 0; i < 42; i += 1) {
            const day = new Date(gridStart);
            day.setDate(gridStart.getDate() + i);
            const iso = toIsoDate(day);
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "day";
            btn.textContent = String(day.getDate());
            btn.dataset.iso = iso;
            if (day.getMonth() !== monthStart.getMonth()) btn.classList.add("outside");
            if (iso === toIsoDate(today)) btn.classList.add("today");
            if (iso === selectedIso) btn.classList.add("selected");

            const count = getMessages(iso).length;
            if (count > 0) btn.classList.add("has-messages");
            if (count >= 4) btn.classList.add("many-messages");

            calendarDays.appendChild(btn);
          }
        }

        function openSheet(iso) {
          selectedIso = iso;
          sheetDate.textContent = formatSheetDate(iso);
          sheet.classList.add("open");
          sheet.setAttribute("aria-hidden", "false");
          renderMessages();
          renderCalendar();
          setTimeout(() => {
            messageList.scrollTop = messageList.scrollHeight;
          }, 0);
        }

        function closeSheetView() {
          sheet.classList.remove("open");
          sheet.setAttribute("aria-hidden", "true");
          editingIndex = null;
          messageInput.value = "";
        }

        function renderMessages() {
          messageList.innerHTML = "";
          const list = getMessages(selectedIso);
          list.forEach((msg, index) => {
            const bubble = document.createElement("div");
            bubble.className = `bubble ${msg.author === "chip" ? "left" : "right"}`;
            bubble.dataset.index = String(index);
            bubble.innerHTML = `
              <div>${msg.content}</div>
              <span class="meta">${msg.name} • ${formatTime(msg.timestamp)}</span>
            `;
            attachLongPress(bubble, index);
            messageList.appendChild(bubble);
          });
        }

        function formatTime(ts) {
          return new Date(ts).toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" });
        }

        function attachLongPress(el, index) {
          let timer = null;
          const start = () => {
            timer = setTimeout(() => {
              if (confirm("Xóa tin nhắn này?")) {
                const list = getMessages(selectedIso);
                list.splice(index, 1);
                state[selectedIso] = list;
                saveState();
                renderMessages();
                renderCalendar();
              }
            }, 600);
          };
          const clear = () => {
            if (timer) clearTimeout(timer);
            timer = null;
          };
          el.addEventListener("pointerdown", start);
          el.addEventListener("pointerup", clear);
          el.addEventListener("pointerleave", clear);
        }

        function setAuthor(next) {
          author = next;
          authorNghia.classList.toggle("active", author === "nghia");
          authorChip.classList.toggle("active", author === "chip");
        }

        function sendMessage() {
          const content = messageInput.value.trim();
          if (!content) return;
          const list = getMessages(selectedIso);
          const msg = {
            author,
            name: author === "nghia" ? "Trọng Nghĩa (Chồng iu)" : "Chíp (Vợ iu)",
            content,
            timestamp: Date.now()
          };
          if (editingIndex !== null) {
            list[editingIndex] = msg;
            editingIndex = null;
          } else {
            list.push(msg);
          }
          state[selectedIso] = list;
          saveState();
          messageInput.value = "";
          renderMessages();
          renderCalendar();
          messageList.scrollTop = messageList.scrollHeight;
        }

        function editLastMessage() {
          const list = getMessages(selectedIso);
          if (!list.length) return;
          const lastIndex = list.length - 1;
          editingIndex = lastIndex;
          messageInput.value = list[lastIndex].content;
          messageInput.focus();
        }

        function autoResize() {
          messageInput.style.height = "auto";
          messageInput.style.height = `${Math.min(messageInput.scrollHeight, 140)}px`;
        }

        calendarDays.addEventListener("click", (event) => {
          const btn = event.target.closest(".day");
          if (!btn) return;
          selectedIso = btn.dataset.iso;
          openSheet(selectedIso);
        });

        prevMonthBtn.addEventListener("click", () => {
          monthCursor = addMonths(monthCursor, -1);
          renderCalendar();
        });

        nextMonthBtn.addEventListener("click", () => {
          monthCursor = addMonths(monthCursor, 1);
          renderCalendar();
        });

        let touchStartX = 0;
        calendarDays.addEventListener("touchstart", (e) => {
          touchStartX = e.touches[0].clientX;
        });
        calendarDays.addEventListener("touchend", (e) => {
          const delta = e.changedTouches[0].clientX - touchStartX;
          if (Math.abs(delta) < 40) return;
          monthCursor = addMonths(monthCursor, delta > 0 ? -1 : 1);
          renderCalendar();
        });

        closeSheet.addEventListener("click", closeSheetView);
        sheet.addEventListener("click", (e) => {
          if (e.target === sheet) closeSheetView();
        });

        authorNghia.addEventListener("click", () => setAuthor("nghia"));
        authorChip.addEventListener("click", () => setAuthor("chip"));
        sendBtn.addEventListener("click", sendMessage);
        editLastBtn.addEventListener("click", editLastMessage);
        messageInput.addEventListener("input", autoResize);
        messageInput.addEventListener("keydown", (event) => {
          if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
          }
        });

        setAuthor(author);
        renderCalendar();
      });
    </script>
  </body>
</html>
