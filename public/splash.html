<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HDHA</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #fff6f2;
        font-family: "Baloo 2", "Quicksand", "Segoe UI", sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      .splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #fff6f2;
      }
      .mark {
        font-size: clamp(40px, 14vw, 104px);
        font-weight: 700;
        letter-spacing: 0.18em;
        margin-left: 0.18em;
        color: #ff6fb0;
        opacity: 0;
        transform: translateY(6px);
        animation: fadeIn 0.6s ease-out 0.2s forwards;
      }

      .fade-out {
        animation: fadeOut 0.45s ease-in forwards;
      }

      @keyframes fadeIn {
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeOut {
        to { opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div class="splash" id="splash">
      <div class="mark">HA</div>
    </div>

    <script>
      (function initSplash() {
        const splash = document.getElementById("splash");
        const params = new URLSearchParams(window.location.search);
        const rawNext = params.get("next") || "/index.html";
        const next = rawNext.startsWith("/") ? rawNext : "/index.html";
        const authed = localStorage.getItem("app_auth") === "1";
        const loginUrl = `/login.html?next=${encodeURIComponent(next)}`;
        const targetUrl = authed ? next : loginUrl;
        sessionStorage.setItem("splash_seen", "1");

        const totalMs = 1200;
        const fadeMs = 450;

        setTimeout(() => {
          splash.classList.add("fade-out");
        }, totalMs - fadeMs);

        setTimeout(() => {
          window.location.replace(targetUrl);
        }, totalMs);
      })();
    </script>
  </body>
</html>
