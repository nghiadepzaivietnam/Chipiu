<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gửi thông báo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fff7f1;
      --card: #ffffff;
      --text: #2b1b1b;
      --accent: #ff5f8d;
      --shadow: 0 18px 45px rgba(255, 95, 141, 0.18);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(720px, 100%);
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      border: 1px solid rgba(255, 95, 141, 0.15);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }
    p {
      margin: 0 0 18px;
      opacity: 0.75;
    }
    label {
      display: block;
      font-weight: 600;
      margin: 14px 0 8px;
    }
    input, textarea {
      width: 100%;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 16px;
      font-family: inherit;
      background: #fff;
    }
    textarea { min-height: 120px; resize: vertical; }
    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .row > * { flex: 1 1 200px; }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    button {
      border: none;
      background: var(--accent);
      color: #fff;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(255, 95, 141, 0.3);
    }
    .secondary {
      background: #fff;
      color: var(--accent);
      border: 1px solid rgba(255, 95, 141, 0.25);
      box-shadow: none;
    }
    .status {
      margin-top: 12px;
      font-size: 14px;
      opacity: 0.85;
      min-height: 20px;
    }
    .hint {
      font-size: 13px;
      opacity: 0.7;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Gửi thông báo</h1>
    <p>Trang này chỉ dùng để gửi push tới những thiết bị đã bật thông báo.</p>

    <label for="title">Tiêu đề</label>
    <input id="title" type="text" placeholder="Ví dụ: Nhớ uống nước nhé">

    <label for="message">Nội dung</label>
    <textarea id="message" placeholder="Nhập nội dung thông báo..."></textarea>

    <div class="row">
      <div>
        <label for="url">Link khi bấm (tuỳ chọn)</label>
        <input id="url" type="url" placeholder="https://hdha-app.onrender.com/">
      </div>
      <div>
        <label for="token">Mã admin</label>
        <input id="token" type="password" placeholder="Nhập ADMIN_TOKEN">
        <div class="hint">Mã này phải trùng với `ADMIN_TOKEN` trên server.</div>
      </div>
    </div>

    <div class="actions">
      <button id="sendBtn" type="button">Gửi thông báo</button>
      <button id="clearBtn" class="secondary" type="button">Xoá nội dung</button>
    </div>

    <div class="status" id="status"></div>
  </main>

  <script src="/auth-guard.js"></script>
  <script>
    const el = (id) => document.getElementById(id);
    const titleEl = el("title");
    const messageEl = el("message");
    const urlEl = el("url");
    const tokenEl = el("token");
    const statusEl = el("status");
    const sendBtn = el("sendBtn");
    const clearBtn = el("clearBtn");

    const savedToken = localStorage.getItem("notify_admin_token");
    if (savedToken) tokenEl.value = savedToken;

    const setStatus = (text, ok = true) => {
      statusEl.textContent = text;
      statusEl.style.color = ok ? "#2b1b1b" : "#c0392b";
    };

    clearBtn.addEventListener("click", () => {
      titleEl.value = "";
      messageEl.value = "";
      urlEl.value = "";
      setStatus("");
    });

    sendBtn.addEventListener("click", async () => {
      const title = titleEl.value.trim();
      const message = messageEl.value.trim();
      const url = urlEl.value.trim();
      const token = tokenEl.value.trim();

      if (!title || !message) {
        setStatus("Vui lòng nhập tiêu đề và nội dung.", false);
        return;
      }
      if (!token) {
        setStatus("Thiếu mã admin.", false);
        return;
      }

      localStorage.setItem("notify_admin_token", token);
      sendBtn.disabled = true;
      setStatus("Đang gửi...");

      try {
        const res = await fetch("/api/notify", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-admin-token": token
          },
          body: JSON.stringify({ title, message, url })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          setStatus(data.error ? `Lỗi: ${JSON.stringify(data.error)}` : "Gửi thất bại.", false);
        } else {
          setStatus(`Đã gửi. Recipients: ${data.recipients ?? "?"}`);
        }
      } catch (err) {
        setStatus(`Lỗi mạng: ${err.message || err}`, false);
      } finally {
        sendBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
